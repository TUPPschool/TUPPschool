<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบลาออนไลน์ TUPP School</title>
    <!-- FontAwesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #f4f7f6;
        }

        /* ----- LOGIN SCREEN OVERLAY ----- */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            padding: 20px;
        }

        #login-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            margin-bottom: 28px;
        }

        .login-icon-bg {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: #ffffff;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            margin-bottom: 16px;
            box-shadow: 0 8px 16px rgba(0, 123, 255, 0.3);
        }

        .login-header h2 {
            font-size: 24px;
            color: #2c3e50;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .login-header p {
            font-size: 14px;
            color: #7f8c8d;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #34495e;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.input-icon {
            position: absolute;
            left: 14px;
            color: #95a5a6;
            font-size: 16px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            font-size: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            outline: none;
            transition: all 0.3s ease;
            background-color: #f8fafc;
        }

        .input-wrapper input:focus {
            border-color: #007bff;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.15);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            cursor: pointer;
            color: #95a5a6;
            font-size: 16px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            font-size: 13px;
            color: #64748b;
        }

        .remember-me label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #007bff, #0056b3);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0, 123, 255, 0.3);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 123, 255, 0.4);
        }

        .error-message {
            background-color: #fee2e2;
            border: 1px solid #fca5a5;
            color: #dc2626;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            text-align: left;
        }

        .login-footer {
            margin-top: 24px;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid #f1f5f9;
            padding-top: 16px;
        }

        /* ----- MAIN APPLICATION FRAME ----- */
        #app-frame {
            width: 100%;
            height: 100vh;
            border: none;
            display: block;
        }

        /* TOPBAR LOGOUT BAR */
        #user-topbar {
            position: fixed;
            top: 12px;
            right: 20px;
            z-index: 9990;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #334155;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            background-color: #e2e8f0;
            color: #007bff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-logout:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-overlay">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon-bg">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h2>ระบบลาออนไลน์</h2>
                <p>เข้าสู่ระบบเพื่อใช้งาน TUPP School</p>
            </div>

            <div id="error-msg" class="error-message">
                <i class="fa-solid fa-triangle-exclamation"></i> <span id="error-text">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</span>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">ชื่อผู้ใช้ / รหัสพนักงาน</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" placeholder="ระบุชื่อผู้ใช้งาน" required autocomplete="username">
                        <i class="fa-solid fa-user input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">รหัสผ่าน</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="ระบุรหัสผ่าน" required autocomplete="current-password">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <i class="fa-solid fa-eye toggle-password" id="toggle-pw" onclick="togglePasswordVisibility()"></i>
                    </div>
                </div>

                <div class="remember-me">
                    <label>
                        <input type="checkbox" id="remember"> บันทึกการเข้าสู่ระบบ
                    </label>
                </div>

                <button type="submit" class="btn-login">
                    <span>เข้าสู่ระบบ</span>
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>

            <div class="login-footer">
                &copy; TUPP School - Online Leave Management
            </div>
        </div>
    </div>

    <!-- USER TOPBAR -->
    <div id="user-topbar" style="display: none;">
        <div class="user-info">
            <div class="user-avatar">
                <i class="fa-solid fa-user"></i>
            </div>
            <span id="display-username">User</span>
        </div>
        <button class="btn-logout" onclick="handleLogout()">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>ออกจากระบบ</span>
        </button>
    </div>

    <!-- TARGET PAGE FRAME -->
    <iframe id="app-frame" src="about:blank"></iframe>

</body>
</html>
